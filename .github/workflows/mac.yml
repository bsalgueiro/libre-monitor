name: Mac

# Builds and tests the native macOS code. Runs only when something under mac/ (or this file) changes.
on:
  push:
    branches: [macos, main]
    paths: ['mac/**', '.github/workflows/mac.yml']
  pull_request:
    paths: ['mac/**', '.github/workflows/mac.yml']

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
