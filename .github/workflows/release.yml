name: Release

# Pushing a tag such as v0.1.0 builds the widget for Windows and macOS and publishes it as a GitHub release,
# so people can download LibreMonitor-win-x64.exe or LibreMonitor-mac.zip and run it with nothing else installed.
#
# The release is created only at the end, after both platforms have tested and built successfully. If either
# fails, no release is published, so there is never a release with only one of the two apps.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the release and attach files

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/LibreMonitor.Core.Tests -c Release

      - name: Publish self-contained single file
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/LibreMonitor.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rename-Item publish/LibreMonitor.App.exe LibreMonitor-win-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: publish/LibreMonitor-win-x64.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        working-directory: mac
        run: swift test

      - name: Build the universal app
        working-directory: mac
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x scripts/make-app.sh
          VERSION="${TAG#v}" ./scripts/make-app.sh

      # A release build must not contain the developer switches.
      - name: Release build contains no developer mode
        working-directory: mac
        run: |
          strings build/LibreMonitor.app/Contents/MacOS/LibreMonitor > release-strings.txt
          test -s release-strings.txt
          if grep -q -- '--simulate' release-strings.txt; then
            echo "Release binary contains developer-mode code"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: mac/build/LibreMonitor-mac.zip
          if-no-files-found: error

  publish:
    needs: [windows, mac] # runs only if both succeeded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release with checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum LibreMonitor-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          gh release create "$TAG" dist/LibreMonitor-win-x64.exe dist/LibreMonitor-mac.zip dist/SHA256SUMS.txt \
            THIRD-PARTY-NOTICES.md --title "$TAG" --generate-notes
