name: Release

# Pushing a tag such as v0.1.0 builds the widget and publishes it as a GitHub release,
# so people can download LibreMonitor-win-x64.exe and run it with nothing else installed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/LibreMonitor.Core.Tests -c Release

      - name: Publish self-contained single file
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/LibreMonitor.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Rename-Item publish/LibreMonitor.App.exe LibreMonitor-win-x64.exe
          $hash = (Get-FileHash publish/LibreMonitor-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LibreMonitor-win-x64.exe" | Set-Content publish/SHA256SUMS.txt

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG `
            publish/LibreMonitor-win-x64.exe publish/SHA256SUMS.txt `
            --title $env:TAG --generate-notes
