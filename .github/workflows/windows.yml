name: Windows

# Builds the Windows app and runs the .NET tests. Runs only when the .NET code (or this file) changes.
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (Debug, includes the WPF app)
        run: dotnet build windows/LibreMonitor.slnx

      - name: Test
        run: dotnet test windows/tests/LibreMonitor.Core.Tests --no-build
